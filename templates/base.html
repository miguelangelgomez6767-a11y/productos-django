<!-- ===================================================== -->
<!-- Plantilla: base.html -->
<!-- Esta página utiliza Django Templates para mostrar datos. -->
<!-- ===================================================== -->
<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Metadatos básicos para que la página sea adaptable a diferentes dispositivos. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Sistema de Productos{% endblock %}</title>

    <!-- Estilos generales de toda la aplicación. -->
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            color: #333;
        }

        header {
            background-color: #1e88e5;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .contenedor {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .encabezado-seccion {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .encabezado-seccion h2 {
            margin-top: 0;
        }

        .texto-ayuda {
            color: #666;
        }

        .boton {
            display: inline-block;
            background-color: #1e88e5;
            color: white;
            padding: 10px 18px;
            border-radius: 5px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .boton:hover {
            background-color: #1565c0;
        }

        .boton-secundario {
            background-color: #777;
        }

        .boton-secundario:hover {
            background-color: #555;
        }

        .boton-peligro {
            background-color: #d32f2f;
        }

        .boton-peligro:hover {
            background-color: #b71c1c;
        }

        .boton-pequeno {
            padding: 7px 11px;
            font-size: 13px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th {
            background-color: #1e88e5;
            color: white;
        }

        th, td {
            padding: 14px;
            border: 1px solid #ddd;
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #f5f5f5;
        }

        .acciones-tabla {
            white-space: nowrap;
        }

        .mensaje {
            padding: 20px;
            background-color: #f1f1f1;
            text-align: center;
            border-radius: 5px;
            margin-top: 20px;
        }

        form {
            margin-top: 20px;
        }

        form p {
            margin-bottom: 20px;
        }

        form label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        form input:not([type="checkbox"]),
        form textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            font-family: inherit;
        }

        form input[type="checkbox"] {
            width: auto;
            transform: scale(1.2);
            margin-right: 8px;
        }

        .errorlist {
            color: #d32f2f;
            padding-left: 20px;
        }

        .acciones {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .estado {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
        }

        .estado.activo {
            background-color: #dff3e4;
            color: #1b5e20;
        }

        .estado.inactivo {
            background-color: #fde0e0;
            color: #b71c1c;
        }

        .confirmacion {
            text-align: center;
            max-width: 650px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        @media (max-width: 700px) {
            .encabezado-seccion {
                flex-direction: column;
                align-items: flex-start;
            }

            .acciones-tabla {
                white-space: normal;
            }
        }
    </style>
</head>

<body>

    <!-- Encabezado principal y menú de navegación. -->
    <header>
        <h1>Sistema de Productos</h1>

        <nav>
            <a href="{% url 'lista_productos' %}">Productos</a>
            <a href="{% url 'nuevo_producto' %}">Registrar producto</a>
            <a href="{% url 'lista_categorias' %}">Categorías</a>
        </nav>
    </header>

    <!-- Contenido específico de cada página hija. -->
    <main>
        {% block contenido %}
        {% endblock %}
    </main>

    <!-- Pie de página común para todas las vistas. -->
    <footer>
        <p>Sistema de productos - Django</p>
    </footer>

</body>
</html>
