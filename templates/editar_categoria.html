<!-- ===================================================== -->
<!-- Plantilla: editar_categoria.html -->
<!-- Esta página utiliza Django Templates para mostrar datos. -->
<!-- ===================================================== -->
{% extends 'base.html' %}
<!-- Heredamos la estructura y los estilos definidos en base.html. -->

{% block title %}
Modificar categoría
{% endblock %}

{% block contenido %}

<div class="contenedor formulario-contenedor">

    <h2>Modificar categoría</h2>

    <form method="POST">
        {% csrf_token %} <!-- Protección CSRF para formularios enviados por POST. -->

        <!-- Django genera aquí los campos del formulario automáticamente. -->
        {{ formulario.as_p }}

        <div class="acciones">
            <button type="submit" class="boton">
                Actualizar categoría
            </button>

            <a href="{% url 'lista_categorias' %}" class="boton boton-secundario">
                Cancelar
            </a>
        </div>
    </form>

</div>

{% endblock %}
