<!-- ===================================================== -->
<!-- Plantilla: editar_producto.html -->
<!-- Esta página utiliza Django Templates para mostrar datos. -->
<!-- ===================================================== -->
{% extends 'base.html' %}
<!-- Heredamos la estructura y los estilos definidos en base.html. -->

{% block title %}
Editar producto
{% endblock %}

{% block contenido %}

<div class="contenedor">

    <h2>Editar producto</h2>
    <p class="texto-ayuda">Modifica la información de <strong>{{ producto.nombre }}</strong>.</p>

    <form method="POST">
        {% csrf_token %} <!-- Protección CSRF para formularios enviados por POST. -->

        <!-- Django genera aquí los campos del formulario automáticamente. -->
        {{ formulario.as_p }}

        <div class="acciones">
            <button type="submit" class="boton">
                Guardar cambios
            </button>

            <a href="{% url 'lista_productos' %}" class="boton boton-secundario">
                Cancelar
            </a>
        </div>
    </form>

</div>

{% endblock %}
